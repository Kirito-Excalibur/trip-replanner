name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12" # matches python_version in langgraph.json
      - run: uv sync --locked --group dev
      - run: uvx ruff check --select F,E9,B src tests scripts
      - run: uv run langgraph validate
      - run: uv run pytest -q
      - name: End-to-end against a local Agent Server (no secrets; heuristic ranker)
        run: RUN_E2E=1 uv run pytest -q tests/test_e2e.py
